<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AHP Decision Engine — kalkulator AHP gratis untuk mahasiswa</title>
  <meta name="description" content="Kalkulator Analytic Hierarchy Process (AHP) gratis: hierarki bertingkat, perbandingan berpasangan skala Saaty, penilaian kelompok, uji konsistensi, analisis sensitivitas, serta laporan PDF dan Excel. Berjalan sepenuhnya di browser.">
  <meta name="theme-color" content="#14213d">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/img/icon-nusait.webp" sizes="192x192" type="image/webp">
  <link rel="canonical" href="https://edgarcia-id.github.io/ahp-decision-engine/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AHP Decision Engine — kalkulator AHP gratis">
  <meta property="og:description" content="Susun hierarki, isi perbandingan berpasangan, cek konsistensi, uji sensitivitas, dan unduh laporan PDF/Excel. Gratis, tanpa akun, data tetap di browser.">
  <meta property="og:url" content="https://edgarcia-id.github.io/ahp-decision-engine/">
  <meta property="og:locale" content="id_ID">
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/app.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "AHP Decision Engine",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web browser",
    "inLanguage": "id",
    "url": "https://edgarcia-id.github.io/ahp-decision-engine/",
    "description": "Kalkulator Analytic Hierarchy Process (AHP) gratis untuk mahasiswa dan peneliti.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" },
    "author": { "@type": "Person", "name": "Alfredo Garcia Elbarta Tarigan", "identifier": "https://orcid.org/0009-0001-4549-5129" },
    "publisher": { "@type": "Organization", "name": "PT Nusa Industri Teknologi (NusaIT)", "url": "https://nusait.com" },
    "license": "https://opensource.org/licenses/MIT"
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Lompat ke konten</a>

  <header class="topbar">
    <a class="brand" href="./" title="AHP Decision Engine">
      <img src="assets/img/icon-nusait.webp" alt="" width="28" height="28">
      <span class="brand-name">AHP Decision Engine</span>
    </a>
    <label class="title-field"><span class="sr">Judul proyek</span>
      <input id="project-title" type="text" maxlength="160" autocomplete="off" spellcheck="false">
    </label>
    <span id="save-state" class="save-state" aria-live="polite"></span>
    <div class="top-actions" id="topbar-actions">
      <button class="btn ghost on-dark" data-act="samples">Contoh &amp; baru</button>
      <button class="btn ghost on-dark" data-act="open-file">Buka</button>
      <button class="btn ghost on-dark" data-act="save-json" title="Unduh proyek (.json) — Ctrl+S">Simpan</button>
    </div>
    <button class="btn ghost on-dark icon-only" data-act="help" aria-label="Panduan" title="Panduan">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.6 9a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
    </button>
  </header>

  <nav id="steps" class="steps" aria-label="Langkah kerja"></nav>

  <main id="main" tabindex="-1">
    <noscript><p class="panel">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>
  </main>

  <footer class="foot">
    <p>Gratis untuk mahasiswa, dosen, dan peneliti. Semua perhitungan berjalan di browser Anda.</p>
    <p><a href="https://github.com/edgarcia-id/ahp-decision-engine" target="_blank" rel="noopener">Kode sumber (MIT)</a>
      <span aria-hidden="true">/</span> Dikembangkan oleh <a href="https://nusait.com" target="_blank" rel="noopener">Ed Garcia, NusaIT</a></p>
  </footer>

  <input type="file" id="file-input" accept=".json,.csv,application/json,text/csv" multiple hidden>

  <div id="modal" class="modal" hidden>
    <div id="modal-card" class="modal-card" role="dialog" aria-modal="true" aria-label="Dialog">
      <button id="modal-close" class="icon-btn modal-x" aria-label="Tutup">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="assets/js/ahp-core.js"></script>
  <script src="assets/js/model.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
